name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          VERSION=${{ github.event.inputs.version }}
          cp app/build/outputs/apk/debug/app-debug.apk tosker-${VERSION}-debug.apk
          echo "APK_PATH=tosker-${VERSION}-debug.apk" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Tosker ${{ github.event.inputs.version }}
          body: |
            ## Tosker Android App ${{ github.event.inputs.version }}

            Google Tasks 연동 Android 할일 입력 앱 (팝업 다이얼로그 UI)

            ### 기능
            - Google 계정 로그인
            - Google Tasks 목록 선택
            - 할 일 입력 (텍스트 + 날짜)
            - Upload 버튼 또는 Enter로 등록

            ### 설치 방법
            1. 기기 설정 → 보안 → **알 수 없는 출처** 허용
            2. APK 파일 다운로드 후 설치

            > ⚠️ **주의**: 이 빌드는 Firebase 플레이스홀더로 생성되었습니다.
            > 실제 Google Tasks 연동을 위해 `google-services.json` 교체 및 OAuth 설정이 필요합니다.
          files: ${{ env.APK_PATH }}
          make_latest: true
